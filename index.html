<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOY FACTORY: DARKNESS</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .game-container {
            background-color: #1e1e1e;
            border: 2px solid #8b0000;
            border-radius: 10px;
            padding: 20px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 0 15px rgba(139, 0, 0, 0.5);
        }
        h1 {
            color: #ff3333;
            text-align: center;
            font-size: 24px;
            margin-bottom: 5px;
        }
        p.subtitle {
            text-align: center;
            font-size: 12px;
            color: #aaa;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .stats {
            background-color: #2a2a2a;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .stat-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        .log-box {
            background-color: #000;
            color: #00ff00;
            height: 150px;
            overflow-y: auto;
            padding: 10px;
            border: 1px solid #444;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .log-entry {
            margin-bottom: 8px;
            border-bottom: 1px dashed #333;
            padding-bottom: 4px;
        }
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        button {
            background-color: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 10px;
            border-radius: 5px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #555;
        }
        button:disabled {
            background-color: #222;
            color: #666;
            cursor: not-allowed;
            border-color: #333;
        }
        .restart-btn {
            grid-column: span 2;
            background-color: #8b0000;
            display: none;
        }
        .restart-btn:hover {
            background-color: #aa0000;
        }
    </style>
</head>
<body>

<div class="game-container">
    <h1>🆘 TOY FACTORY</h1>
    <p class="subtitle">Tip: running consumes energy, searching for the exit uses flashlight charge.</p>

    <div class="stats">
        <div class="stat-item"><span>Distance to monster:</span> <span id="distance">10 m</span></div>
        <div class="stat-item"><span>Energy:</span> <span id="energy">100%</span></div>
        <div class="stat-item"><span>Flashlight charge:</span> <span id="flashlight">100%</span></div>
        <div class="stat-item"><span>Spare batteries:</span> <span id="batteries">1</span></div>
    </div>

    <div class="log-box" id="logBox"></div>

    <div class="controls">
        <button id="btnRun" onclick="action('run')">🏃 Run</button>
        <button id="btnSearch" onclick="action('search')">🔦 Search</button>
        <button id="btnHide" onclick="action('hide')">🙈 Hide</button>
        <button id="btnCharge" onclick="action('charge')">🔋 Charge</button>
        <button id="btnRestart" class="restart-btn" onclick="initGame()">🔄 Play Again</button>
    </div>
</div>

<script>
    let distance, energy, batteries, flashlight, escaped, gameOver;

    const logBox = document.getElementById('logBox');
    const elDistance = document.getElementById('distance');
    const elEnergy = document.getElementById('energy');
    const elFlashlight = document.getElementById('flashlight');
    const elBatteries = document.getElementById('batteries');
    const btnRestart = document.getElementById('btnRestart');
    const actionButtons = [
        document.getElementById('btnRun'),
        document.getElementById('btnSearch'),
        document.getElementById('btnHide'),
        document.getElementById('btnCharge')
    ];

    function log(message, color = "#00ff00") {
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        entry.style.color = color;
        entry.innerText = message;
        logBox.appendChild(entry);
        logBox.scrollTop = logBox.scrollHeight;
    }

    function updateStats() {
        elDistance.innerText = `${distance} m`;
        elEnergy.innerText = `${energy}%`;
        elFlashlight.innerText = `${flashlight}%`;
        elBatteries.innerText = batteries;
    }

    function toggleButtons(state) {
        actionButtons.forEach(btn => btn.disabled = !state);
        btnRestart.style.display = state ? 'none' : 'block';
    }

    function initGame() {
        distance = 10;
        energy = 100;
        batteries = 1;
        flashlight = 100;
        escaped = false;
        gameOver = false;
        logBox.innerHTML = '';
        log("Game started! Darkness envelops the factory...", "#fff");
        updateStats();
        toggleButtons(true);
    }

    function action(type) {
        if (gameOver) return;

        if (type === 'run') {
            if (energy >= 20) {
                let move = Math.floor(Math.random() * 3) + 2;
                energy -= 20;
                distance += move;
                log(`🏃 Rapid run! Distance increased by ${move}m.`);
            } else {
                log(`🥵 Not enough stamina for a fast run!`, "#ffff00");
                distance += 1;
            }
        } 
        else if (type === 'search') {
            if (flashlight > 0) {
                flashlight -= 25;
                if (Math.random() < 0.25) {
                    log(`🚪 Yes! Emergency exit found! THIS IS FREEDOM!`, "#00ffff");
                    escaped = true;
                } else {
                    log(`🔦 Checking walls... Only empty shelves so far.`);
                }
            } else {
                log(`🌑 Can't see anything in the dark. Need to charge the flashlight!`, "#ff9900");
            }
        } 
        else if (type === 'hide') {
            energy += 15;
            if (Math.random() < 0.6) {
                log(`🙈 Holding breath. Huggy walked right past...`, "#aaa");
                distance += 1;
            } else {
                log(`😱 Accidentally knocked over a metal can! The monster noticed!`, "#ff3333");
                distance -= 3;
            }
        } 
        else if (type === 'charge') {
            if (batteries > 0) {
                batteries -= 1;
                flashlight = 100;
                log(`🔋 Battery replaced. The light is bright again!`, "#00ffff");
            } else {
                log(`🚫 No spare batteries!`, "#ff3333");
            }
        }

        if (escaped) {
            endGame(true);
            return;
        }

        let hagiSpeed = Math.floor(Math.random() * 3) + 1;
        distance -= hagiSpeed;
        log(`👣 Huggy Wuggy takes ${hagiSpeed} steps towards you...`, "#ff6666");

        if (Math.random() < 0.15) {
            log(`🎁 Oh! Battery found on the floor!`, "#ffff00");
            batteries += 1;
        }

        updateStats();

        if (distance <= 0) {
            endGame(false);
        }
    }

    function endGame(isWin) {
        gameOver = true;
        updateStats();
        toggleButtons(false);
        if (isWin) {
            log("🎉 MANAGED TO ESCAPE! GAME WON.", "#00ff00");
        } else {
            log("💀 DARKNESS CONSUMED EVERYTHING... GAME OVER.", "#ff0000");
            elDistance.innerText = "0 m";
        }
    }

    window.onload = initGame;
</script>

</body>
</html>
